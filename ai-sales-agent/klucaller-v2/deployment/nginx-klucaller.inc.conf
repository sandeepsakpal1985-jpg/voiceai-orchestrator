# Reference nginx blocks for klucaller.creamylane.com (Phase 3 — additive only)
#
# Review checklist before APPROVE_NGINX=1:
#   [ ] Proxies HTTP to KluCaller upstream
#   [ ] WebSocket upgrade headers on /
#   [ ] Long timeouts for voice WebSocket (3600s)
#   [ ] server_name klucaller.creamylane.com only — does not alter KluKnow/KluCare routes
#   [ ] No new port bindings (uses existing nginx :80/:443)
#   [ ] Cert path matches klucare pattern (/etc/letsencrypt/live/...)
#
# NOTE: kluknow-production-nginx-1 runs in Docker. The location / blocks below use
# 127.0.0.1 for documentation; the live script uses 172.17.0.1 (docker bridge gateway).
# Phase 1 binds 127.0.0.1:8090; Phase 3 requires KLUCALLER_BIND_HOST=0.0.0.0 (approved).

map $http_upgrade $klucaller_connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP — ACME + redirect (or proxy before cert exists)
server {
    listen 80;
    server_name klucaller.creamylane.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://klucaller.creamylane.com$request_uri;
    }
}

# HTTPS — KluCaller V2 (requires cert at /opt/klucare/certs/live/klucaller.creamylane.com/)
server {
    listen 443 ssl;
    http2 on;
    server_name klucaller.creamylane.com;

    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/klucaller.creamylane.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klucaller.creamylane.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # LiveKit signaling — enable when KLUCALLER_LIVEKIT_AUDIO=1 and livekit is published
    location /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $klucaller_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # App — HTTP + WebSocket (/v1/voice/ws, /v1/conversation/ws)
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $klucaller_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
