<!DOCTYPE html>
<html>
<head>
    <title>Voice Agent Microphone Test</title>
</head>
<body>

<h2>AI Voice Agent</h2>

<button id="connect">Connect</button>
<button id="startMic">Start Recording</button>
<button id="stopMic">Stop Recording</button>

<hr>

<div id="log"></div>

<script>

let ws;
let mediaRecorder;
let audioChunks = [];

function log(msg)
{
    console.log(msg);

    document.getElementById("log").innerHTML +=
        "<div>" + msg + "</div>";
}

document.getElementById("connect").onclick = () =>
{
    ws = new WebSocket("ws://127.0.0.1:8000/ws/voice");

    ws.onopen = () =>
    {
        log("CONNECTED");
    };

    ws.onmessage = async (event) =>
    {
        let data;

        try
        {
            data = JSON.parse(event.data);
        }
        catch
        {
            return;
        }

        console.log("SERVER:", data);

        if(data.type === "transcription")
        {
            log("YOU: " + data.text);
        }

        if(data.type === "response")
        {
            log("AI: " + data.text);
        }

        if(data.type === "response_done")
        {
            log("AI RESPONSE COMPLETE");
        }

        if(data.type === "audio")
        {
            log("PLAYING AUDIO");

            const binaryString =
                atob(data.base64);

            const len =
                binaryString.length;

            const bytes =
                new Uint8Array(len);

            for(let i = 0; i < len; i++)
            {
                bytes[i] =
                    binaryString.charCodeAt(i);
            }

            const blob =
                new Blob(
                    [bytes],
                    { type: "audio/wav" }
                );

            const url =
                URL.createObjectURL(blob);

            const audio =
                new Audio(url);

            try
            {
                await audio.play();
                log("AUDIO STARTED");
            }
            catch(err)
            {
                console.error(err);
                log("AUDIO PLAY FAILED");
            }
        }

        if(data.type === "error")
        {
            log("ERROR: " + data.message);
        }
    };

    ws.onclose = () =>
    {
        log("DISCONNECTED");
    };
};

document.getElementById("startMic").onclick =
async () =>
{
    if(!ws || ws.readyState !== WebSocket.OPEN)
    {
        alert("Connect first");
        return;
    }

    const stream =
        await navigator.mediaDevices.getUserMedia({
            audio: true
        });

    audioChunks = [];

    mediaRecorder =
        new MediaRecorder(stream);

    mediaRecorder.ondataavailable =
        (event) =>
    {
        if(event.data.size > 0)
        {
            audioChunks.push(event.data);
        }
    };

    mediaRecorder.onstart =
        () =>
    {
        log("RECORDING...");
    };

    mediaRecorder.start();
};

document.getElementById("stopMic").onclick =
async () =>
{
    if(!mediaRecorder)
    {
        return;
    }

    mediaRecorder.onstop =
        async () =>
    {
        log("PROCESSING AUDIO...");

        const blob =
            new Blob(
                audioChunks,
                { type: "audio/webm" }
            );

        const arrayBuffer =
            await blob.arrayBuffer();

        ws.send(arrayBuffer);

        log(
            "SENT AUDIO: " +
            Math.round(blob.size / 1024) +
            " KB"
        );
    };

    mediaRecorder.stop();

    log("RECORDING STOPPED");
};

</script>

</body>
</html>
