# MetaPilot AI — Production Docker Compose
#
# Deploy to VPS:
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# For initial setup, run:
#   chmod +x deploy/setup-ssl.sh deploy/deploy.sh
#   ./deploy/setup-ssl.sh yourdomain.com
#   ./deploy/deploy.sh

services:
  # ── Reverse Proxy ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - socialpilot

  # ── Certbot for SSL ──
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/var/www/certbot
      - ./ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - socialpilot

  # ── Frontend ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.yourdomain.com
    env_file:
      - .env.prod
    restart: unless-stopped
    networks:
      - socialpilot

  # ── API Backend ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/socialpilot
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - FRONTEND_URL=https://yourdomain.com
      - META_CALLBACK_URL=https://api.yourdomain.com/api/meta/callback
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - socialpilot
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - socialpilot

  # ── Redis ──
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - socialpilot

  # ── Qdrant Vector DB ──
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - socialpilot

  # ── Background Workers ──
  comment-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["node", "workers/dist/workers/src/comment.worker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env.prod
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    networks:
      - socialpilot

  dm-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["node", "workers/dist/workers/src/dm.worker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env.prod
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    networks:
      - socialpilot

  reengagement-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["node", "workers/dist/workers/src/reengagement.worker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env.prod
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    networks:
      - socialpilot

networks:
  socialpilot:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  certbot_data:
