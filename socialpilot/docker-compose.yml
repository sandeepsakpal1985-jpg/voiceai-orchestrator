services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # 6380 to avoid conflict with WSL relay on 6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/socialpilot
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  comment-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["node", "workers/dist/workers/src/comment.worker.js"]
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - redis
      - backend

  dm-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["node", "workers/dist/workers/src/dm.worker.js"]
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - redis
      - backend

  reengagement-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["node", "workers/dist/workers/src/reengagement.worker.js"]
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - redis
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
