<!DOCTYPE html>
<html>
<head>
    <title>AI Voice Agent Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #chat {
            border: 1px solid #ccc;
            height: 500px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        #message {
            width: 80%;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
        }

        .user {
            color: blue;
        }

        .ai {
            color: green;
        }

        .system {
            color: gray;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<h2>AI Chat Test</h2>

<div id="chat"></div>

<input
    id="message"
    type="text"
    placeholder="Type your question..."
/>

<button id="send">Send</button>

<script>

let ws;
let currentResponse = "";

const chat = document.getElementById("chat");

function addMessage(sender, text, cssClass = "")
{
    const div = document.createElement("div");

    div.className = cssClass;

    div.innerHTML =
        "<b>" + sender + ":</b> " + text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

function connect()
{
    ws = new WebSocket("ws://127.0.0.1:8000/ws/voice");

    ws.onopen = () =>
    {
        console.log("CONNECTED");
        addMessage("SYSTEM", "Connected to AI server", "system");
    };

    ws.onclose = () =>
    {
        addMessage("SYSTEM", "Disconnected", "system");
    };

    ws.onerror = (err) =>
    {
        console.error(err);
        addMessage("ERROR", "WebSocket error", "error");
    };

    ws.onmessage = async (event) =>
    {
        const data = JSON.parse(event.data);

        console.log("SERVER:", data);

        if (data.type === "connected")
        {
            addMessage(
                "SYSTEM",
                "Conversation ID: " + data.conversation_id,
                "system"
            );
        }

        if (data.type === "state")
        {
            addMessage(
                "STATE",
                data.state,
                "system"
            );
        }

        if (data.type === "sentiment")
        {
            console.log("Sentiment:", data);
        }

        if (data.type === "response")
        {
            currentResponse += data.text;
        }

        if (data.type === "response_done")
        {
            addMessage(
                "AI",
                currentResponse,
                "ai"
            );

            currentResponse = "";
        }

        if (data.type === "audio")
        {
            try
            {
                console.log("AUDIO RECEIVED");

                const binaryString =
                    atob(data.base64);

                const bytes =
                    new Uint8Array(binaryString.length);

                for (let i = 0; i < binaryString.length; i++)
                {
                    bytes[i] =
                        binaryString.charCodeAt(i);
                }

                const blob =
                    new Blob(
                        [bytes],
                        { type: "audio/wav" }
                    );

                const audioUrl =
                    URL.createObjectURL(blob);

                const player =
                    new Audio(audioUrl);

                player.onplay = () =>
                {
                    console.log("PLAYING AUDIO");
                };

                player.onerror = (e) =>
                {
                    console.error(
                        "AUDIO ERROR",
                        e
                    );
                };

                await player.play();
            }
            catch (err)
            {
                console.error(
                    "Audio playback failed",
                    err
                );
            }
        }

        if (data.type === "error")
        {
            addMessage(
                "ERROR",
                data.message,
                "error"
            );
        }
    };
}

connect();

function sendMessage()
{
    const input =
        document.getElementById("message");

    const text =
        input.value.trim();

    if (!text)
        return;

    addMessage(
        "YOU",
        text,
        "user"
    );

    ws.send(
        JSON.stringify({
            type: "text",
            text: text
        })
    );

    input.value = "";
}

document
    .getElementById("send")
    .onclick = sendMessage;

document
    .getElementById("message")
    .addEventListener(
        "keypress",
        function(event)
        {
            if (event.key === "Enter")
            {
                sendMessage();
            }
        }
    );

</script>

</body>
</html>
