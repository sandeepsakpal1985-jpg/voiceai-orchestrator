version: "3.9"

x-shared-env: &shared-env
  POSTGRES_SERVER: postgres
  POSTGRES_USER: ${POSTGRES_USER:-corpgpt}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpgpt_dev}
  POSTGRES_DB: ${POSTGRES_DB:-corpgpt}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: corpgpt_documents
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-too}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
  LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  STORAGE_LOCAL_PATH: /app/storage
  CORS_ORIGINS: http://localhost:3000,http://localhost:8000
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corpgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpgpt_dev}
      POSTGRES_DB: ${POSTGRES_DB:-corpgpt}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpgpt"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *shared-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-corpgpt}:${POSTGRES_PASSWORD:-corpgpt_dev}@postgres:5432/${POSTGRES_DB:-corpgpt}
    volumes:
      - ./storage:/app/storage
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      <<: *shared-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-corpgpt}:${POSTGRES_PASSWORD:-corpgpt_dev}@postgres:5432/${POSTGRES_DB:-corpgpt}
    volumes:
      - ./storage:/app/storage
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
