version: "3.9"

services:
  postgres: &postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources: { limits: { memory: 2G } }

  redis: &redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    deploy:
      resources: { limits: { memory: 1G } }

  qdrant: &qdrant
    image: qdrant/qdrant:v1.13
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources: { limits: { memory: 2G } }

  backend: &backend
    build: ./backend
    environment:
      ENVIRONMENT: production
    env_file: .env
    volumes:
      - document_storage:/app/storage
    depends_on: [postgres, redis, qdrant]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s; timeout: 10s; retries: 3
    deploy:
      replicas: 2
      resources: { limits: { cpus: "1", memory: 2G } }

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    ports: []
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "status"]
    deploy:
      replicas: 1
      resources: { limits: { cpus: "2", memory: 4G } }

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: https://api.corpgpt.local
      NEXT_PUBLIC_APP_NAME: CorporateGPT
    ports:
      - "3000:3000"
    depends_on: [backend]
    restart: unless-stopped
    deploy:
      resources: { limits: { memory: 512M } }

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf
      - ./deploy/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on: [backend, frontend]
    deploy:
      resources: { limits: { memory: 256M } }

volumes:
  postgres_data:  redis_data:  qdrant_data:  document_storage:
